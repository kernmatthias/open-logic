name: Coverage Simulation
run-name: ${{ github.actor }} triggered Coverage simulation

# Set the permissions for the workflow
permissions:
  checks: write
  pull-requests: write

#Set Triggers
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

#Jobs
jobs:
  simulation:
    runs-on: [self-hosted]
    steps:
      # Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: true
      # add astral
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.5' # pin uv version
      # Setup python
      - name: Setup Python
        run : |
          # source $LOCAL_TOOLS
          cd ./sim
          uv clean
          uv sync --locked
      # Run simulation
      - name: Run Simulation
        run: |
          # source $LOCAL_TOOLS
          cd ./sim
          uv run ./run.py --modelsim --coverage
      # Coverage Simulation (check > 95%)
      # On PRs errors are required if coverage is low
      - name: Check Coverage Level
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          # source $LOCAL_TOOLS
          cd ./sim
          uv run ./AnalyzeCoverage.py --min_coverage=95
      # Coverage Simulation (update badges)
      # On main, we want to udpate badges ALWAYS (also if coverage is low)
      - name: Create Coverage Badges
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: |
          # source $LOCAL_TOOLS
          cd ./sim
          uv run ./AnalyzeCoverage.py --badges

