[project]
name = "open-logic-sim"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-cloud-storage>=3.13.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pexpect>=4.9.0",
    "prettytable>=3.18.0",
    "pygithub>=2.10.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "vsg==3.27",
    "vunit-hdl==5.0.0.dev11",
]

[tool.uv.extra-build-dependencies]
vunit-hdl = ["setuptools"]

